name: Build WhatsApp

on:
  workflow_dispatch:
  push:
    branches:
      - w-injector/phase-2-runtime-foundation
      - w-injector/phase-3-privacy-runtime

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out pinned source and submodules
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        timeout-minutes: 5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle*
            **/gradle-wrapper.properties
            gradle/libs.versions.toml
            **/gradle.properties

      - name: Install pinned Android build components
        timeout-minutes: 10
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=30s 8m \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --channel=3 \
            'platform-tools' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'ndk;28.2.13676358' \
            'cmake;3.22.1'

      - name: Grant execute permission for gradlew
        timeout-minutes: 1
        run: chmod +x gradlew

      - name: Clean-build WhatsApp debug baseline
        timeout-minutes: 20
        run: |
          timeout --signal=TERM --kill-after=30s 18m \
            ./gradlew --no-daemon clean testWhatsappDebugUnitTest assembleWhatsappDebug

      - name: Verify and record APK
        id: apk
        timeout-minutes: 2
        shell: bash
        run: |
          mapfile -t apks < <(find app/build/outputs/apk/whatsapp/debug \
            -maxdepth 1 -type f -name 'WaEnhancer-*.apk' -print)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          sha256sum "$apk" | tee apk-sha256.txt
          size=$(stat -c '%s' "$apk")
          name=$(basename "$apk")
          printf 'commit=%s\npath=%s\nfilename=%s\nsize_bytes=%s\n' \
            "$GITHUB_SHA" "$apk" "$name" "$size" | tee apk-metadata.txt
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "filename=$name" >> "$GITHUB_OUTPUT"
          echo "size_bytes=$size" >> "$GITHUB_OUTPUT"
          {
            echo '### WaEnhancer WhatsApp debug APK'
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Path: \`$apk\`"
            echo "- Size: \`$size bytes\`"
            echo "- SHA-256: \`$(sha256sum "$apk" | cut -d ' ' -f 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v7
        timeout-minutes: 5
        with:
          name: WaEnhancer-whatsappDebug-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ steps.apk.outputs.path }}
            apk-sha256.txt
            apk-metadata.txt
