name: AirPods XAPL Fix CI

on:
  push:
    branches:
      - airpods-xapl-fix-build
    paths:
      - 'airpods-xapl-fix/**'
      - '.github/workflows/airpods-xapl-fix.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.1'

      - name: Unit tests
        run: gradle -p airpods-xapl-fix testDebugUnitTest --stacktrace

      - name: Build APK
        run: gradle -p airpods-xapl-fix assembleDebug --stacktrace

      - name: Show APK
        run: ls -lh airpods-xapl-fix/app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AirPods-XAPL-Fix
          path: airpods-xapl-fix/app/build/outputs/apk/debug/*.apk
